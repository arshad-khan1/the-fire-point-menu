<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6F0E5"/>
      <stop offset="100%" stop-color="#E4D8C4"/>
    </linearGradient>
    <linearGradient id="toastCrust" x1="40" y1="60" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4A2A04" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="188" height="188" rx="30" stroke="#4A2A04" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Sourdough Toast Slice -->
  <g filter="url(#shadow)">
    <!-- Outer Crust -->
    <path d="M50 85 C50 55, 150 55, 150 85 L145 150 C145 160, 55 160, 55 150 Z" fill="url(#toastCrust)" stroke="#4A2A04" stroke-width="3.5"/>
    <!-- Inner Melted Cheese Top -->
    <path d="M60 90 C60 68, 140 68, 140 90 L136 142 C136 148, 64 148, 64 142 Z" fill="#FEF08A" stroke="#4A2A04" stroke-width="2"/>
  </g>

  <!-- Cheese Drip -->
  <path d="M72 148 Q76 160 82 148" fill="#FBBF24" stroke="#4A2A04" stroke-width="1.5"/>
  <path d="M118 148 Q124 162 128 148" fill="#FBBF24" stroke="#4A2A04" stroke-width="1.5"/>

  <!-- Garlic & Herbs Sprinkles -->
  <circle cx="85" cy="95" r="3" fill="#22C55E"/>
  <circle cx="115" cy="92" r="2.5" fill="#22C55E"/>
  <circle cx="98" cy="115" r="3.5" fill="#E26A2C"/>
  <circle cx="75" cy="125" r="2" fill="#22C55E"/>
  <circle cx="125" cy="120" r="2.5" fill="#22C55E"/>
  <rect x="100" y="100" width="8" height="8" rx="2" fill="#FFFFFF" stroke="#4A2A04" stroke-width="1" transform="rotate(15 100 100)"/>
</svg>
