<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6F0E5"/>
      <stop offset="100%" stop-color="#E4D8C4"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="60" y1="80" x2="140" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4A2A04" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="188" height="188" rx="30" stroke="#4A2A04" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Chilled Beverage Glass Bottle -->
  <g filter="url(#shadow)">
    <!-- Bottle Cap -->
    <rect x="90" y="30" width="20" height="10" rx="3" fill="#F59E0B" stroke="#4A2A04" stroke-width="2"/>

    <!-- Bottle Neck -->
    <path d="M92 40 L92 68 L70 95 L70 165 C70 172, 130 172, 130 165 L130 95 L108 68 L108 40 Z" fill="url(#bottleGrad)" stroke="#4A2A04" stroke-width="3.5"/>

    <!-- Label Banner -->
    <rect x="70" y="105" width="60" height="35" rx="6" fill="#F6F0E5" stroke="#4A2A04" stroke-width="2.5"/>
    <text x="100" y="126" fill="#4A2A04" font-family="Arial, sans-serif" font-size="11" font-weight="900" text-anchor="middle">COLD</text>
  </g>

  <!-- Ice Splashes / Bubbles -->
  <circle cx="80" cy="85" r="2.5" fill="#FFFFFF"/>
  <circle cx="120" cy="90" r="2" fill="#FFFFFF"/>
  <circle cx="78" cy="148" r="2" fill="#FFFFFF"/>
  <circle cx="122" cy="152" r="3" fill="#FFFFFF"/>
</svg>
