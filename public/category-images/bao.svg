<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6F0E5"/>
      <stop offset="100%" stop-color="#E4D8C4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4A2A04" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="188" height="188" rx="30" stroke="#4A2A04" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Steamer Leaf Liner -->
  <ellipse cx="100" cy="148" rx="66" ry="18" fill="#15803D" opacity="0.3" filter="url(#shadow)"/>

  <!-- Bao Bottom Fold -->
  <g filter="url(#shadow)">
    <path d="M42 125 C42 155, 158 155, 158 125 L150 110 C150 140, 50 140, 50 110 Z" fill="#EDE7DC" stroke="#4A2A04" stroke-width="3"/>
  </g>

  <!-- Spicy Glazed Meat Filling Layer -->
  <g filter="url(#shadow)">
    <path d="M48 115 Q100 128 152 115 Q150 135 100 138 Q50 135 48 115 Z" fill="#9A2C00" stroke="#4A2A04" stroke-width="2.5"/>
    <circle cx="75" cy="122" r="3" fill="#22C55E"/>
    <circle cx="125" cy="124" r="2.5" fill="#FEF08A"/>
    <ellipse cx="100" cy="125" rx="4" ry="2" fill="#FFFFFF" transform="rotate(-15 100 125)"/>
  </g>

  <!-- Bao Top Pillowy Fold -->
  <g filter="url(#shadow)">
    <path d="M42 112 C42 60, 158 60, 158 112 C158 122, 42 122, 42 112 Z" fill="#FFFFFF" stroke="#4A2A04" stroke-width="3.5"/>
    <!-- Pillowy Contour Lines -->
    <path d="M70 76 Q100 88 130 76" stroke="#E4D8C4" stroke-width="3" fill="none"/>
  </g>

  <!-- Steam Whisps -->
  <path d="M85 52 Q78 40 85 28" stroke="#BAA17D" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M115 50 Q122 38 115 25" stroke="#4A2A04" stroke-opacity="0.3" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
