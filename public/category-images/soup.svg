<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6F0E5"/>
      <stop offset="100%" stop-color="#E4D8C4"/>
    </linearGradient>
    <linearGradient id="soupLiquid" x1="50" y1="100" x2="150" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E26A2C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4A2A04" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="188" height="188" rx="30" stroke="#4A2A04" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Steam Trails -->
  <path d="M75 55 Q65 42 75 30" stroke="#BAA17D" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M100 50 Q110 38 100 24" stroke="#4A2A04" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M125 58 Q135 44 125 32" stroke="#BAA17D" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Bowl Outer Shadow & Body -->
  <g filter="url(#shadow)">
    <!-- Base Saucer -->
    <ellipse cx="100" cy="158" rx="55" ry="12" fill="#EDE7DC" stroke="#4A2A04" stroke-width="3"/>
    
    <!-- Bowl Exterior -->
    <path d="M40 96 C40 144, 62 154, 100 154 C138 154, 160 144, 160 96 Z" fill="#F6F0E5" stroke="#4A2A04" stroke-width="3.5"/>
    <path d="M48 102 C52 136, 70 146, 100 146 C130 146, 148 136, 152 102 Z" fill="#EDE7DC"/>
  </g>

  <!-- Bowl Rim & Liquid -->
  <ellipse cx="100" cy="96" rx="60" ry="18" fill="#F6F0E5" stroke="#4A2A04" stroke-width="3.5"/>
  <ellipse cx="100" cy="97" rx="54" ry="14" fill="url(#soupLiquid)"/>

  <!-- Cream Swirl & Herbs -->
  <path d="M80 96 Q92 90 100 97 Q108 103 120 95" stroke="#FEF08A" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="92" cy="94" r="2.5" fill="#22C55E"/>
  <circle cx="108" cy="98" r="2" fill="#22C55E"/>
  <circle cx="114" cy="93" r="1.5" fill="#FEF08A"/>

  <!-- Soup Spoon -->
  <path d="M135 75 Q150 90 162 100" stroke="#8A5A2B" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="132" cy="74" rx="10" ry="7" transform="rotate(-30 132 74)" fill="#EDE7DC" stroke="#4A2A04" stroke-width="2.5"/>
</svg>
