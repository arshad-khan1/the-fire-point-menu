<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6F0E5"/>
      <stop offset="100%" stop-color="#E4D8C4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4A2A04" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="188" height="188" rx="30" stroke="#4A2A04" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Golden Fries Sticks -->
  <g filter="url(#shadow)">
    <!-- Fry 1 -->
    <rect x="62" y="55" width="14" height="75" rx="4" transform="rotate(-15 62 55)" fill="#F59E0B" stroke="#4A2A04" stroke-width="2.5"/>
    <!-- Fry 2 -->
    <rect x="80" y="45" width="14" height="85" rx="4" transform="rotate(-5 80 45)" fill="#FBBF24" stroke="#4A2A04" stroke-width="2.5"/>
    <!-- Fry 3 -->
    <rect x="98" y="42" width="14" height="88" rx="4" fill="#F59E0B" stroke="#4A2A04" stroke-width="2.5"/>
    <!-- Fry 4 -->
    <rect x="116" y="48" width="14" height="82" rx="4" transform="rotate(8 116 48)" fill="#FBBF24" stroke="#4A2A04" stroke-width="2.5"/>
    <!-- Fry 5 -->
    <rect x="132" y="58" width="14" height="72" rx="4" transform="rotate(18 132 58)" fill="#F59E0B" stroke="#4A2A04" stroke-width="2.5"/>
  </g>

  <!-- Red Fry Box Container -->
  <g filter="url(#shadow)">
    <path d="M55 105 L68 170 L132 170 L145 105 Z" fill="#E26A2C" stroke="#4A2A04" stroke-width="3.5"/>
    <path d="M55 105 Q100 120 145 105 L138 170 L62 170 Z" fill="#C2410C"/>
    <!-- Flame / Logo Emblematics -->
    <circle cx="100" cy="142" r="14" fill="#FEF08A" stroke="#4A2A04" stroke-width="2"/>
    <path d="M100 134 Q105 142 100 148 Q95 142 100 134 Z" fill="#E26A2C"/>
  </g>

  <!-- Peri Peri Spice Dust Dots -->
  <circle cx="75" cy="70" r="1.5" fill="#EF4444"/>
  <circle cx="92" cy="58" r="2" fill="#EF4444"/>
  <circle cx="106" cy="62" r="1.5" fill="#EF4444"/>
  <circle cx="124" cy="72" r="2" fill="#EF4444"/>
</svg>
