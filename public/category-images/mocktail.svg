<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6F0E5"/>
      <stop offset="100%" stop-color="#E4D8C4"/>
    </linearGradient>
    <linearGradient id="drinkGrad" x1="50" y1="80" x2="150" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4A2A04" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="188" height="188" rx="30" stroke="#4A2A04" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Straw -->
  <line x1="135" y1="25" x2="90" y2="140" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>

  <!-- Lime Wheel on Rim -->
  <g filter="url(#shadow)" transform="translate(62, 58)">
    <circle cx="0" cy="0" r="18" fill="#86EFAC" stroke="#15803D" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="14" fill="#22C55E"/>
    <!-- Lime Wedges lines -->
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#86EFAC" stroke-width="1.5"/>
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#86EFAC" stroke-width="1.5"/>
  </g>

  <!-- Highball Mocktail Glass -->
  <g filter="url(#shadow)">
    <path d="M68 68 L76 164 L124 164 L132 68 Z" fill="url(#drinkGrad)" stroke="#4A2A04" stroke-width="3.5"/>
    <ellipse cx="100" cy="68" rx="32" ry="8" fill="#BAE6FD" stroke="#4A2A04" stroke-width="3"/>
  </g>

  <!-- Floating Ice Cubes -->
  <rect x="80" y="80" width="16" height="16" rx="4" fill="#FFFFFF" opacity="0.8" stroke="#0284C7" stroke-width="1.5" transform="rotate(15 80 80)"/>
  <rect x="100" y="105" width="18" height="18" rx="4" fill="#FFFFFF" opacity="0.8" stroke="#0284C7" stroke-width="1.5" transform="rotate(-10 100 105)"/>

  <!-- Mint Leaves -->
  <path d="M102 55 Q115 42 124 55 Q110 65 102 55 Z" fill="#22C55E" stroke="#15803D" stroke-width="1.5"/>
  <path d="M115 50 Q125 38 132 48 Q120 58 115 50 Z" fill="#4ADE80" stroke="#15803D" stroke-width="1.5"/>

  <!-- Bubbles -->
  <circle cx="85" cy="130" r="3" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="112" cy="140" r="2" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="95" cy="150" r="2.5" fill="#FFFFFF" opacity="0.6"/>
</svg>
