<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6F0E5"/>
      <stop offset="100%" stop-color="#E4D8C4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4A2A04" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="188" height="188" rx="30" stroke="#4A2A04" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Platter Tray -->
  <g filter="url(#shadow)">
    <rect x="30" y="70" width="140" height="90" rx="18" fill="#EDE7DC" stroke="#4A2A04" stroke-width="3.5"/>
    <rect x="36" y="76" width="128" height="78" rx="14" fill="#F6F0E5" stroke="#BAA17D" stroke-width="1.5"/>
  </g>

  <!-- Rice Bowl in Combo -->
  <g filter="url(#shadow)">
    <circle cx="70" cy="115" r="28" fill="#E26A2C" stroke="#4A2A04" stroke-width="2.5"/>
    <circle cx="70" cy="115" r="23" fill="#FEF08A"/>
    <circle cx="64" cy="112" r="2.5" fill="#22C55E"/>
    <circle cx="76" cy="116" r="2" fill="#DC2626"/>
    <circle cx="70" cy="121" r="2" fill="#F59E0B"/>
  </g>

  <!-- Gravy Bowl in Combo -->
  <g filter="url(#shadow)">
    <circle cx="130" cy="105" r="24" fill="#4A2A04" stroke="#4A2A04" stroke-width="2.5"/>
    <circle cx="130" cy="105" r="19" fill="#9A2C00"/>
    <rect x="124" y="98" width="10" height="10" rx="2" fill="#F59E0B" stroke="#4A2A04" stroke-width="1"/>
    <rect x="131" y="107" width="9" height="9" rx="2" fill="#FEF08A"/>
  </g>

  <!-- Fries Side in Combo Tray -->
  <g filter="url(#shadow)" transform="translate(108, 122)">
    <rect x="0" y="0" width="8" height="24" rx="2" fill="#F59E0B" stroke="#4A2A04" stroke-width="1.5" transform="rotate(-15)"/>
    <rect x="8" y="-4" width="8" height="26" rx="2" fill="#FBBF24" stroke="#4A2A04" stroke-width="1.5"/>
    <rect x="16" y="2" width="8" height="22" rx="2" fill="#F59E0B" stroke="#4A2A04" stroke-width="1.5" transform="rotate(10)"/>
  </g>

  <!-- Combo Badge Star Burst -->
  <circle cx="156" cy="48" r="18" fill="#E26A2C" stroke="#4A2A04" stroke-width="2.5"/>
  <text x="156" y="52" fill="#F6F0E5" font-family="Arial, sans-serif" font-size="10" font-weight="900" text-anchor="middle">1+1</text>
</svg>
