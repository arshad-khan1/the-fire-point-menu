<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6F0E5"/>
      <stop offset="100%" stop-color="#E4D8C4"/>
    </linearGradient>
    <linearGradient id="crustGrad" x1="40" y1="40" x2="160" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4A2A04" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="188" height="188" rx="30" stroke="#4A2A04" stroke-opacity="0.2" stroke-width="2"/>

  <g filter="url(#shadow)">
    <!-- Thick Golden Pizza Crust (Arc Top) -->
    <path d="M42 62 C42 45, 158 45, 158 62 L150 78 C150 65, 50 65, 50 78 Z" fill="url(#crustGrad)" stroke="#4A2A04" stroke-width="3.5"/>

    <!-- Pizza Triangle Slice Body -->
    <path d="M48 72 L152 72 L100 172 Z" fill="#F59E0B" stroke="#4A2A04" stroke-width="3.5"/>

    <!-- Melted Cheese Surface -->
    <path d="M54 75 L146 75 L100 162 Z" fill="#FBBF24"/>

    <!-- Pepperoni Topping 1 -->
    <circle cx="80" cy="94" r="13" fill="#DC2626" stroke="#4A2A04" stroke-width="2.5"/>
    <circle cx="76" cy="90" r="2.5" fill="#EF4444"/>

    <!-- Pepperoni Topping 2 -->
    <circle cx="120" cy="100" r="12" fill="#DC2626" stroke="#4A2A04" stroke-width="2.5"/>

    <!-- Pepperoni Topping 3 -->
    <circle cx="98" cy="132" r="10" fill="#DC2626" stroke="#4A2A04" stroke-width="2.5"/>

    <!-- Basil Leaves -->
    <path d="M102 85 Q112 78 116 88 Q106 94 102 85 Z" fill="#22C55E" stroke="#15803D" stroke-width="1.5"/>
    <path d="M72 120 Q80 114 84 124 Q76 128 72 120 Z" fill="#22C55E" stroke="#15803D" stroke-width="1.5"/>

    <!-- Cheese String Pull Drips at Tip -->
    <path d="M96 166 Q100 182 104 166" fill="#FBBF24" stroke="#4A2A04" stroke-width="2"/>
  </g>
</svg>
