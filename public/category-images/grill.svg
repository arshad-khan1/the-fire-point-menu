<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6F0E5"/>
      <stop offset="100%" stop-color="#E4D8C4"/>
    </linearGradient>
    <linearGradient id="steakGrad" x1="50" y1="80" x2="150" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4A2A04" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="188" height="188" rx="30" stroke="#4A2A04" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Wooden Cutting Board Platter -->
  <g filter="url(#shadow)">
    <rect x="36" y="70" width="128" height="90" rx="16" fill="#8A5A2B" stroke="#4A2A04" stroke-width="3.5"/>
    <!-- Board Handle -->
    <rect x="164" y="100" width="20" height="30" rx="6" fill="#8A5A2B" stroke="#4A2A04" stroke-width="3"/>
    <circle cx="174" cy="115" r="5" fill="#F6F0E5" stroke="#4A2A04" stroke-width="2"/>
  </g>

  <!-- Grilled Steak / Panini Fillet -->
  <g filter="url(#shadow)">
    <path d="M54 90 C54 75, 146 75, 146 90 L140 135 C140 148, 60 148, 60 135 Z" fill="url(#steakGrad)" stroke="#4A2A04" stroke-width="3.5"/>

    <!-- Seared Diamond Grill Marks -->
    <line x1="70" y1="88" x2="105" y2="136" stroke="#4A2A04" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="90" y1="84" x2="125" y2="132" stroke="#4A2A04" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="110" y1="84" x2="135" y2="118" stroke="#4A2A04" stroke-width="3.5" stroke-linecap="round"/>

    <line x1="105" y1="84" x2="70" y2="132" stroke="#4A2A04" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="125" y1="84" x2="90" y2="132" stroke="#4A2A04" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Rosemary Sprig Garnish -->
  <path d="M68 85 Q90 95 115 88" stroke="#15803D" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="78" cy="86" r="2.5" fill="#22C55E"/>
  <circle cx="92" cy="91" r="2.5" fill="#22C55E"/>
  <circle cx="106" cy="88" r="2.5" fill="#22C55E"/>
  
  <!-- Melted Herb Butter Pat -->
  <ellipse cx="100" cy="104" rx="10" ry="6" fill="#FEF08A" stroke="#4A2A04" stroke-width="1.5"/>
</svg>
