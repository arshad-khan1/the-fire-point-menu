<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6F0E5"/>
      <stop offset="100%" stop-color="#E4D8C4"/>
    </linearGradient>
    <linearGradient id="pastaSauce" x1="60" y1="90" x2="140" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#E26A2C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4A2A04" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="188" height="188" rx="30" stroke="#4A2A04" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Gourmet Wide Pasta Bowl -->
  <g filter="url(#shadow)">
    <ellipse cx="100" cy="154" rx="66" ry="18" fill="#EDE7DC" stroke="#4A2A04" stroke-width="3"/>
    <path d="M38 102 C38 148, 62 158, 100 158 C138 158, 162 148, 162 102 Z" fill="#F6F0E5" stroke="#4A2A04" stroke-width="3.5"/>
    <ellipse cx="100" cy="102" rx="62" ry="20" fill="#E4D8C4" stroke="#4A2A04" stroke-width="3.5"/>
  </g>

  <!-- Creamy Pasta Base -->
  <ellipse cx="100" cy="104" rx="54" ry="16" fill="url(#pastaSauce)"/>

  <!-- Penne / Swirled Pasta Shapes -->
  <g filter="url(#shadow)">
    <!-- Penne 1 -->
    <rect x="62" y="98" width="22" height="9" rx="4" transform="rotate(-20 62 98)" fill="#FEF08A" stroke="#4A2A04" stroke-width="1.5"/>
    <!-- Penne 2 -->
    <rect x="88" y="94" width="24" height="10" rx="4" transform="rotate(15 88 94)" fill="#FBBF24" stroke="#4A2A04" stroke-width="1.5"/>
    <!-- Penne 3 -->
    <rect x="114" y="100" width="22" height="9" rx="4" transform="rotate(-10 114 100)" fill="#FEF08A" stroke="#4A2A04" stroke-width="1.5"/>
  </g>

  <!-- Basil Leaf Garnish -->
  <path d="M100 90 Q112 80 118 90 Q106 100 100 90 Z" fill="#22C55E" stroke="#15803D" stroke-width="1.5"/>
  <path d="M100 90 Q88 82 84 92 Q96 100 100 90 Z" fill="#16A34A" stroke="#15803D" stroke-width="1.5"/>

  <!-- Fork Twisting Pasta -->
  <path d="M130 30 L130 75" stroke="#8A5A2B" stroke-width="4" stroke-linecap="round"/>
  <!-- Fork Tines -->
  <path d="M122 75 L122 92 M127 75 L127 94 M133 75 L133 94 M138 75 L138 92" stroke="#4A2A04" stroke-width="2" stroke-linecap="round"/>
</svg>
