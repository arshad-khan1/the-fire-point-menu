<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6F0E5"/>
      <stop offset="100%" stop-color="#E4D8C4"/>
    </linearGradient>
    <linearGradient id="brownieGrad" x1="60" y1="90" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#1A0D01"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4A2A04" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="188" height="188" rx="30" stroke="#4A2A04" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Sizzling Brownie Cast-Iron Skillet -->
  <g filter="url(#shadow)">
    <!-- Skillet Handle -->
    <rect x="145" y="128" width="35" height="12" rx="5" fill="#361C02" stroke="#4A2A04" stroke-width="2.5"/>

    <!-- Wooden Underplate -->
    <ellipse cx="95" cy="144" rx="65" ry="22" fill="#8A5A2B" stroke="#4A2A04" stroke-width="3"/>
    
    <!-- Cast Iron Pan -->
    <ellipse cx="95" cy="138" rx="58" ry="17" fill="#361C02" stroke="#4A2A04" stroke-width="3"/>
    <ellipse cx="95" cy="136" rx="52" ry="13" fill="#1A0D01"/>
  </g>

  <!-- Fudgy Brownie Square -->
  <g filter="url(#shadow)">
    <rect x="65" y="102" width="60" height="34" rx="6" fill="url(#brownieGrad)" stroke="#4A2A04" stroke-width="3"/>
    <rect x="68" y="104" width="54" height="6" fill="#78350F"/>
  </g>

  <!-- Cold Vanilla Ice Cream Scoop on Top -->
  <g filter="url(#shadow)">
    <circle cx="95" cy="92" r="20" fill="#FFFFFF" stroke="#4A2A04" stroke-width="3"/>
    <path d="M82 96 Q95 102 108 96" fill="#FEF08A"/>
  </g>

  <!-- Molten Fudge Sauce Drizzle & Cherry -->
  <path d="M85 82 Q95 90 92 106 M102 84 Q106 95 104 110" stroke="#361C02" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <circle cx="95" cy="70" r="7" fill="#DC2626" stroke="#4A2A04" stroke-width="2"/>
  <path d="M95 63 Q102 55 108 58" stroke="#4A2A04" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Sizzling Steam Whisps -->
  <path d="M68 85 Q60 70 68 58" stroke="#BAA17D" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M122 88 Q130 72 122 60" stroke="#E26A2C" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
