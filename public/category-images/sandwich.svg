<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6F0E5"/>
      <stop offset="100%" stop-color="#E4D8C4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4A2A04" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="188" height="188" rx="30" stroke="#4A2A04" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Club Sandwich Stack (Triangle Cut) -->
  <g filter="url(#shadow)" transform="translate(10, 10)">
    <!-- Bottom Bread Slice -->
    <path d="M40 145 L150 145 L95 60 Z" fill="#D97706" stroke="#4A2A04" stroke-width="3.5"/>
    <path d="M46 141 L144 141 L95 68 Z" fill="#FEF08A"/>

    <!-- Layer 1: Veggies / Lettuce -->
    <path d="M42 135 L148 135" stroke="#22C55E" stroke-width="6" stroke-linecap="round"/>

    <!-- Layer 2: Middle Bread -->
    <path d="M48 127 L142 127" stroke="#D97706" stroke-width="5" stroke-linecap="round"/>

    <!-- Layer 3: Melted Cheese & Patty -->
    <path d="M52 119 L138 119" stroke="#C2410C" stroke-width="6" stroke-linecap="round"/>
    <path d="M56 112 L134 112" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>

    <!-- Top Bread Slice -->
    <path d="M60 105 L130 105 L95 60 Z" fill="#D97706" stroke="#4A2A04" stroke-width="3"/>
    <path d="M65 102 L125 102 L95 68 Z" fill="#FDE047"/>

    <!-- Grill Mark Lines on Top Bread -->
    <line x1="75" y1="98" x2="88" y2="80" stroke="#4A2A04" stroke-width="2.5"/>
    <line x1="92" y1="98" x2="105" y2="80" stroke="#4A2A04" stroke-width="2.5"/>

    <!-- Toothpick Pin -->
    <line x1="95" y1="35" x2="95" y2="70" stroke="#8A5A2B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="95" cy="32" r="6" fill="#EF4444" stroke="#4A2A04" stroke-width="2"/>
  </g>
</svg>
